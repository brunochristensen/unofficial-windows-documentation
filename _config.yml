# Site settings — Unofficial Windows Documentation
# _config.yml NOT hot-reloaded. Restart w/ `jekyll serve` after edits.

title: Bruno Christensen's blog thing
tagline: The home of Unofficial Windows Documentation and more.
description: >-
  A collection of guides, references, and write-ups.
author: Bruno Christensen
email: brunojchris@gmail.com

# If deploying to <user>.github.io, baseurl: "/unofficial-windows-documentation"
# If using a custom domain, set baseurl to "" and url to domain.
baseurl: ""
url: "https://brunochristensen.net"

github_username: brunochristensen

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  docs:
    output: true
    permalink: /docs/:path/
  tools:
    output: true
    permalink: /tools/:path/
  writeups:
    output: true
    permalink: /write-ups/:path/

defaults:
  - scope:
      path: ""
      type: docs
    values:
      layout: doc
  - scope:
      path: ""
      type: tools
    values:
      layout: doc
  - scope:
      path: ""
      type: writeups
    values:
      layout: doc
  - scope:
      path: ""
      type: pages
    values:
      layout: page

sass:
  style: compressed
  sass_dir: _sass

exclude:
  - docs
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
