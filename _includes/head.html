<meta name="theme-color" content="#0067c0">

{%- comment -%} Set the theme before paint to avoid a flash of the wrong mode. {%- endcomment -%}
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {}
  })();
</script>
